<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terminal</title>
    <link rel="stylesheet" href="xterm.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #08090b;
            font-family: 'Geist Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        #terminal-container {
            width: 100%;
            height: 100%;
            padding: 16px;
            margin: 0;
            background: #08090b;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
            box-sizing: border-box;
        }
        .xterm {
            height: 100% !important;
            width: 100% !important;
            background: #08090b !important;
        }
        .xterm-viewport {
            height: 100% !important;
            background: #08090b !important;
            border-radius: 0 0 12px 12px;
        }
        .xterm-screen {
            background: #08090b !important;
            border-radius: 0 0 12px 12px;
        }
        /* Modern scrollbar styling matching the design */
        .xterm-viewport::-webkit-scrollbar {
            width: 8px;
        }
        .xterm-viewport::-webkit-scrollbar-track {
            background: #0f1012;
            border-radius: 4px;
        }
        .xterm-viewport::-webkit-scrollbar-thumb {
            background: #2b2c31;
            border-radius: 4px;
            transition: background 0.2s ease;
        }
        .xterm-viewport::-webkit-scrollbar-thumb:hover {
            background: #f5ae3a;
        }
        .xterm-viewport::-webkit-scrollbar-thumb:active {
            background: #7c3aed;
        }
        /* Terminal cursor styling */
        .xterm-cursor-layer .xterm-cursor {
            background: #f5ae3a !important;
        }
        /* Selection styling */
        .xterm .xterm-selection div {
            background-color: rgba(245, 174, 58, 0.28) !important;
        }
    </style>
</head>
<body>
<div id="terminal-container"></div>
<script src="xterm.js"></script>
<script>
    let term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: 'Geist Mono, Consolas, "Courier New", monospace',
        theme: {
            background: '#08090b',
            foreground: '#d4d7de',
            cursor: '#f5ae3a',
            cursorAccent: '#08090b',
            selection: 'rgba(245, 174, 58, 0.28)',
            black: '#1c1d21',
            red: '#ef4444',
            green: '#10b981',
            yellow: '#f59e0b',
            blue: '#3b82f6',
            magenta: '#c084fc',
            cyan: '#06b6d4',
            white: '#f3f4f6',
            brightBlack: '#374151',
            brightRed: '#f87171',
            brightGreen: '#34d399',
            brightYellow: '#fbbf24',
            brightBlue: '#60a5fa',
            brightMagenta: '#f5ae3a',
            brightCyan: '#22d3ee',
            brightWhite: '#ffffff'
        },
        disableStdin: false,
        cursorStyle: 'block',
        scrollback: 1000,
        convertEol: true,
        allowTransparency: true
    });
    
    term.open(document.getElementById('terminal-container'));

    window.sendInputToJava = function (input) {
        term.write(input);
    };
    
    document.addEventListener("DOMContentLoaded", function (event) {
        term.onData(e => {
            if (window.java && window.java.receiveInput) {
                try {
                    window.java.receiveInput(e);
                } catch (error) {
                    console.error('Error sending input to Java:', error);
                }
            }
        });
        
        window.fitTerm = function () {
            var container = document.getElementById('terminal-container');
            if (!container || !term) return;
            var style = window.getComputedStyle(term.element);
            var fontSize = parseFloat(style.fontSize) || 14;
            var cols = Math.max(40, Math.floor(container.clientWidth / (fontSize * 0.62)));
            var rows = Math.max(8, Math.floor(container.clientHeight / (fontSize * 1.4)));
            term.resize(cols, rows);
        };
        window.addEventListener('resize', function () {
            window.fitTerm();
        });
        setTimeout(window.fitTerm, 50);
        setTimeout(window.fitTerm, 300);
    });
</script>
</body>
</html>
